server:
  port: 8085

spring:
  application:
    name: chat-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

openai:
  api-key: ${OPENAI_API_KEY:your-openai-api-key}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.medicatch.chat: DEBUG
