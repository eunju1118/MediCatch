server:
  port: 8082

spring:
  application:
    name: insurance-service
  datasource:
    url: jdbc:mysql://localhost:3306/medicatch_insurance?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:medicatch}
    password: ${DB_PASSWORD:medicatch1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

codef:
  client-id: ${CODEF_CLIENT_ID:demo_client_id}
  client-secret: ${CODEF_CLIENT_SECRET:demo_client_secret}
  public-key: ${CODEF_PUBLIC_KEY:demo_public_key}
  mode: ${CODEF_MODE:DEMO}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.medicatch.insurance: DEBUG
