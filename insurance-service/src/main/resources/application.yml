server:
  port: 8082

spring:
  application:
    name: insurance-service
  main:
    web-application-type: servlet
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/medicatch_insurance?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# CODEF API 설정
codef:
  client-id: ${CODEF_CLIENT_ID}
  client-secret: ${CODEF_CLIENT_SECRET}
  public-key: ${CODEF_PUBLIC_KEY}
  mode: ${DEMO}   # DEMO | REAL

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o
  max-tokens: 800
  temperature: 0.7
  timeout-seconds: 30

feign:
  client:
    config:
      health-service:
        connect-timeout: 3000
        read-timeout: 8000

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.medicatch.insurance: DEBUG
